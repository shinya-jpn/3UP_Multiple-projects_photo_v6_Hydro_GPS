<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場写真調書（3枚仕様）- 定義済みデータ一括作成版</title>

  <!-- EXIF解析ライブラリ（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="写真調書3枚">

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "MS Gothic", sans-serif; color: #000; }
    body { margin: 0; padding: 15px; background: #f0f2f5; color: #000; }
    
    /* 操作メニューバー */
    .controls {
      position: sticky; top: 0; z-index: 1000; background: #fff;
      padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;
    }
    button {
      padding: 9px 14px; border: none; border-radius: 6px; background: #007aff;
      color: white !important; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    button.predefined { background: #009688; color: white !important; }
    button.csv { background: #ff9500; color: white !important; }
    button.save { background: #34c759; color: white !important; }
    button.export { background: #5856d6; color: white !important; }
    button.import { background: #5ac8fa; color: white !important; }
    button.danger { background: #ff3b30; color: white !important; }

    /* A4画面プレビュー設定 (上下20mm・左右30mm余白) */
    .a4-page {
      width: 210mm; min-height: 297mm; padding: 20mm 30mm; margin: 0 auto 20px auto;
      background: white; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      box-sizing: border-box; display: flex; flex-direction: column; position: relative;
    }

    /* タイトルヘッダー */
    .page-title-center {
      text-align: center; font-size: 18px; font-weight: bold;
      letter-spacing: 6px; margin-bottom: 3mm; text-decoration: underline; line-height: 1;
    }

    .photo-grid {
      display: flex; flex-direction: column; gap: 3mm; flex-grow: 1;
    }

    /* 2列構造カード (高さ70mm) */
    .photo-card {
      border: 2px solid #000; border-radius: 0; background: #fff;
      display: flex; height: 70mm; width: 100%; position: relative;
    }
    
    /* 左側属性情報テーブル（幅 50.8mm 固定） */
    .info-table {
      width: 50.8mm; border-right: 2px solid #000; display: flex; flex-direction: column; background: #fff; flex-shrink: 0;
    }
    .info-row {
      border-bottom: 1px solid #000; display: flex; flex-direction: column;
      justify-content: center; padding: 1px 3px; position: relative; text-align: left;
    }
    .info-row:last-child { border-bottom: none; }
    
    .info-row.remark-row {
      flex: 1; justify-content: flex-start;
    }

    .info-label { font-size: 8.5px; font-weight: bold; color: #333; margin-bottom: 1px; text-align: left; }
    
    /* 選択補助用プルダウン */
    .info-select {
      width: 100%; font-size: 8.5px; padding: 1px; border: 1px solid #007aff; border-radius: 2px;
      color: #007aff !important; background: #f0f7ff; margin-bottom: 1px;
      -webkit-appearance: none; appearance: none;
    }

    /* 編集用テキスト枠 */
    .info-input {
      width: 100%; font-size: 9px; padding: 1px 2px; border: 1px solid #aaa; border-radius: 2px;
      color: #000 !important; background: #fff; -webkit-appearance: none; appearance: none;
      text-align: left !important;
    }

    textarea.info-input {
      resize: none; flex: 1; min-height: 2.2em; line-height: 1.15; font-family: inherit;
    }
    
    /* 位置情報枠専用スタイル */
    .gps-container {
      display: flex; gap: 2px; align-items: center; width: 100%;
    }
    .gps-btn {
      padding: 2px 5px; font-size: 9px; background: #007aff; color: #fff !important;
      border: none; border-radius: 3px; white-space: nowrap; cursor: pointer; font-weight: bold;
    }

    /* 調査日（日付入力） */
    input[type="date"].info-input {
      text-align: left !important; justify-content: flex-start !important;
      display: flex !important; align-items: center !important; font-size: 9px; padding: 1px;
    }
    input[type="date"]::-webkit-date-and-time-value {
      text-align: left !important;
    }

    /* 右側写真エリア */
    .image-box {
      flex: 1; height: 100%; background: #f8f8f8; position: relative;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .image-box img {
      max-width: 100%; max-height: 100%; width: auto; height: auto;
      object-fit: contain; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); margin: 0;
    }

    /* 撮影・選択ボタンエリア (Android/iOS Chrome両対応) */
    .placeholder-btn-group {
      display: flex; gap: 8px; justify-content: center; align-items: center;
      z-index: 10; width: 80%;
    }
    .photo-btn {
      flex: 1; padding: 8px 4px; background: #007aff; color: #fff !important;
      font-size: 11px; font-weight: bold; border-radius: 4px; text-align: center;
      cursor: pointer; position: relative; overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15); display: inline-block;
      user-select: none; -webkit-user-select: none;
    }
    .photo-btn.gal-btn { background: #34c759; }
    .photo-btn input[type="file"] {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    /* 写真削除ボタン */
    .img-remove-btn {
      position: absolute; top: 6px; right: 6px; z-index: 20;
      background: rgba(255, 59, 48, 0.88); color: #fff !important;
      border: none; border-radius: 4px; padding: 4px 8px; font-size: 10px;
      font-weight: bold; cursor: pointer;
    }

    /* 削除ボタン */
    .delete-page-btn-container {
      position: absolute; top: 20mm; right: 30mm; z-index: 100;
    }

    /* モーダルポップアップ */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 2000; display: none;
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px;
      display: flex; flex-direction: column; gap: 12px; max-height: 80vh; overflow-y: auto;
    }
    .project-list {
      display: flex; flex-direction: column; gap: 8px; margin-top: 10px;
    }
    .project-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #f9f9f9;
    }

    /* Chrome 印刷規格設定 (A4 100%出力完全対応) */
    @page {
      size: A4 portrait;
      margin: 20mm 30mm; /* 上下20mm・左右30mm余白 */
    }
    @media print {
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        width: 100% !important;
        height: auto !important;
      }
      .controls, .delete-page-btn-container, .modal-overlay, .info-select, .placeholder-btn-group, .img-remove-btn, .gps-btn { display: none !important; }
      #pages-container {
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .a4-page {
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .a4-page:not(:last-child) {
        page-break-after: always !important;
        break-after: page !important;
      }
      .a4-page:last-child {
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
      .photo-card, .info-table, .info-row { border-color: #000 !important; }
      input, textarea {
        border: none !important; color: #000 !important; background: transparent !important;
        -webkit-appearance: none; appearance: none; padding: 0 !important; text-align: left !important;
        resize: none;
      }
      input[type="date"]::-webkit-date-and-time-value {
        text-align: left !important;
      }
      .placeholder { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- 操作メニューバー -->
  <div class="controls">
    <button onclick="addPage(); scheduleAutoSave();">＋ ページ追加</button>
    <button class="predefined" onclick="document.getElementById('predefinedFileInput').click()">定義済みファイル読み込み</button>
    <button class="csv" onclick="document.getElementById('csvFileInput').click()">CSV選択肢読込</button>
    <button class="save" onclick="showProjectModal()">アプリ内保存/切替</button>
    <button class="export" onclick="exportProjectFile()">「ファイル」へ書き出し</button>
    <button class="import" onclick="document.getElementById('importFileInput').click()">「ファイル」から復元</button>
    <button onclick="window.print()">A4 PDF出力 / 印刷</button>
    
    <!-- ファイル入力群 -->
    <input type="file" id="predefinedFileInput" accept=".csv" style="display:none;" onchange="loadPredefinedReportFromCsv(this)">
    <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="loadCategoriesFromCsv(this)">
    <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importProjectFile(this)">
  </div>

  <div id="pages-container"></div>

  <!-- アプリ内プロジェクト管理モーダル -->
  <div id="projectModal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin:0;">アプリ内プロジェクト管理</h3>
      <div>
        <label style="font-size:12px; font-weight:bold;">現在の画面内容を名前をつけて保存:</label>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <input type="text" id="newProjectNameInput" placeholder="例: 現場A_写真調書" style="flex:1; padding:6px; border:1px solid #ccc; border-radius:4px;">
          <button class="save" onclick="saveCurrentProjectNamed()">保存</button>
        </div>
      </div>
      <hr style="width:100%; border:none; border-top:1px solid #eee; margin:5px 0;">
      <div>
        <label style="font-size:12px; font-weight:bold;">保存済みプロジェクト一覧:</label>
        <div id="projectListContainer" class="project-list"></div>
      </div>
      <div style="text-align:right; margin-top:10px;">
        <button class="danger" onclick="closeProjectModal()">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    let CATEGORIES_POINT = [
      "平-沢6", "平串TN-沢11", "平串TN-沢2-1", "平串TN-沢4",
      "平串TN-重金属10", "平串TN-重金属11", "平串TN-重金属12’", "平串TN-重金属13",
      "金-沢1", "金-沢2", "金-沢4"
    ];
    let CATEGORIES_ITEM = [
      "水質分析（現場簡易PH測定）", "定期観測（容器法）", "定期観測（流速計測法）",
      "水位観測（手動水位計観測）", "水位観測（自記水位計観測）", "現場簡易水質測定", "採水"
    ];
    let CATEGORIES_REMARK = [
      "PH=\nEC= mS/m\n水温= 度\n濁度= 度",
      "流量= L/min\nPH=\nEC= mS/m\n水温= 度\n濁度= 度",
      "全景", "近景", "作業状況", "完了状況"
    ];

    let pageCount = 0;
    let autoSaveTimer = null;
    let preCapturedGps = "";

    function getTodayString() {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function scheduleAutoSave() {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        saveAutoDraft();
      }, 500);
    }

    function copySelectToInput(selectEl) {
      const targetInput = selectEl.nextElementSibling;
      if (targetInput) {
        if (selectEl.value === "__CLEAR__") {
          targetInput.value = "";
          targetInput.focus();
        } else if (selectEl.value !== "") {
          targetInput.value = selectEl.value;
        }
      }
      scheduleAutoSave();
    }

    function addPage() {
      pageCount++;
      const container = document.getElementById('pages-container');
      if (!container) return null;

      const pageDiv = document.createElement('div');
      pageDiv.className = 'a4-page';
      pageDiv.id = `page-${pageCount}`;

      let cardsHtml = '';
      const todayStr = getTodayString();

      for (let i = 1; i <= 3; i++) {
        cardsHtml += `
          <div class="photo-card">
            <div class="info-table">
              <div class="info-row">
                <span class="info-label">調査地点</span>
                <select class="info-select select-point" onchange="copySelectToInput(this)">
                  <option value="">▼ 選択肢から選ぶ</option>
                  <option value="__CLEAR__">✏️ その他（自由記入）</option>
                  ${CATEGORIES_POINT.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
                </select>
                <input type="text" class="info-input val-point" placeholder="調査地点（直接入力・編集可）">
              </div>
              <div class="info-row">
                <span class="info-label">項目</span>
                <select class="info-select select-item" onchange="copySelectToInput(this)">
                  <option value="">▼ 選択肢から選ぶ</option>
                  <option value="__CLEAR__">✏️ その他（自由記入）</option>
                  ${CATEGORIES_ITEM.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
                </select>
                <input type="text" class="info-input val-item" placeholder="項目（直接入力・編集可）">
              </div>
              <div class="info-row remark-row">
                <span class="info-label">備考</span>
                <select class="info-select select-remark" onchange="copySelectToInput(this)">
                  <option value="">▼ 選択肢から選ぶ</option>
                  <option value="__CLEAR__">✏️ その他（自由記入）</option>
                  ${CATEGORIES_REMARK.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
                </select>
                <textarea class="info-input val-remark" rows="2" placeholder="備考（直接入力・編集可）"></textarea>
              </div>
              <div class="info-row">
                <span class="info-label">位置情報</span>
                <div class="gps-container">
                  <input type="text" class="info-input val-gps" placeholder="緯度, 経度">
                  <button type="button" class="gps-btn" onclick="getGpsDirect(this)">📍取得</button>
                </div>
              </div>
              <div class="info-row">
                <span class="info-label">調査日</span>
                <input type="date" class="info-input val-date" value="${todayStr}">
              </div>
            </div>

            <div class="image-box">
              <div class="placeholder-btn-group">
                <label class="photo-btn cam-btn">
                  📷 撮影
                  <input type="file" accept="image/*" capture="environment" onchange="previewImage(this, 'img-${pageCount}-${i}')">
                </label>
                <label class="photo-btn gal-btn">
                  🖼️ 選択
                  <input type="file" accept="image/*" onchange="previewImage(this, 'img-${pageCount}-${i}')">
                </label>
              </div>
              <img id="img-${pageCount}-${i}" style="display:none;">
              <button type="button" class="img-remove-btn" onclick="clearImage('img-${pageCount}-${i}', this)" style="display:none;">✕ 削除</button>
            </div>
          </div>
        `;
      }

      pageDiv.innerHTML = `
        <div class="delete-page-btn-container">
          <button class="danger" onclick="this.closest('.a4-page').remove(); scheduleAutoSave();">ページ削除</button>
        </div>
        <div class="page-title-center">現場写真調書</div>
        <div class="photo-grid">${cardsHtml}</div>
      `;

      container.appendChild(pageDiv);
      return pageDiv;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function parseStrictCSV(text) {
      const result = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const nextC = text[i + 1];

        if (c === '"') {
          if (inQuotes && nextC === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push(cell.trim());
          cell = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && nextC === '\n') {
            i++;
          }
          row.push(cell.trim());
          if (row.some(f => f !== '')) {
            result.push(row);
          }
          row = [];
          cell = '';
        } else {
          cell += c;
        }
      }
      if (cell !== '' || row.length > 0) {
        row.push(cell.trim());
        if (row.some(f => f !== '')) {
          result.push(row);
        }
      }
      return result;
    }

    /* 💡 【新機能】PCで作成した「定義済みファイル（CSV）」を読み込み、調書を一括自動生成 */
    async function loadPredefinedReportFromCsv(inputEl) {
      if (!inputEl.files || !inputEl.files[0]) return;
      const file = inputEl.files[0];

      // 現在作業中のデータがある場合の確認
      const currentCards = document.querySelectorAll('.photo-card');
      const hasInputs = Array.from(currentCards).some(card => {
        return card.querySelector('.val-point').value || card.querySelector('.val-item').value || (card.querySelector('img').style.display !== 'none');
      });

      if (hasInputs) {
        if (!confirm("定義済みファイルを読み込むと、現在の画面内容は上書きされます。\n読み込みを実行しますか？")) {
          inputEl.value = '';
          return;
        }
      }

      try {
        const buffer = await file.arrayBuffer();
        let text = new TextDecoder('utf-8').decode(buffer);
        // Shift-JIS自動判定
        if (text.includes('\uFFFD')) {
          text = new TextDecoder('shift-jis').decode(buffer);
        }

        const rows = parseStrictCSV(text);
        if (rows.length === 0) {
          alert('CSVファイルが空か、正しい形式ではありません。');
          return;
        }

        // 有効データ行の抽出（ヘッダー行の自動スキップ判定）
        const validRows = [];
        rows.forEach((cols, idx) => {
          if (idx === 0) {
            const headerStr = cols.join(' ');
            if (headerStr.includes('調査地点') || headerStr.includes('項目') || headerStr.includes('備考') || headerStr.includes('位置情報') || headerStr.includes('調査日')) {
              return; // ヘッダー行をスキップ
            }
          }
          // どこか1つでも値が入っている行を採用
          if (cols.some(c => c.trim() !== '')) {
            validRows.push(cols);
          }
        });

        if (validRows.length === 0) {
          alert('有効な調書データが見つかりませんでした。');
          return;
        }

        // 画面を初期化
        document.getElementById('pages-container').innerHTML = '';
        pageCount = 0;

        const todayStr = getTodayString();
        const totalItems = validRows.length;
        const totalPages = Math.ceil(totalItems / 3);

        // 必要ページを生成してデータを流し込む
        for (let p = 0; p < totalPages; p++) {
          const pageDiv = addPage();
          const cards = pageDiv.querySelectorAll('.photo-card');

          for (let i = 0; i < 3; i++) {
            const dataIndex = p * 3 + i;
            if (dataIndex < totalItems) {
              const row = validRows[dataIndex];
              const card = cards[i];

              // 各項目の割り当て（列順：0:調査地点, 1:項目, 2:備考, 3:位置情報, 4:調査日）
              const pointVal = row[0] ? row[0].trim() : '';
              const itemVal = row[1] ? row[1].trim() : '';
              const remarkVal = row[2] ? row[2].trim() : '';
              const gpsVal = row[3] ? row[3].trim() : '';
              let dateVal = row[4] ? row[4].trim() : '';

              // 日付形式チェック（YYYY-MM-DDに整形、空欄なら本日）
              if (dateVal) {
                dateVal = dateVal.replace(/\//g, '-');
                const parts = dateVal.split('-');
                if (parts.length === 3) {
                  dateVal = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                }
              } else {
                dateVal = todayStr;
              }

              // 枠へ直接セット
              card.querySelector('.val-point').value = pointVal;
              card.querySelector('.val-item').value = itemVal;
              card.querySelector('.val-remark').value = remarkVal;
              card.querySelector('.val-gps').value = gpsVal;
              card.querySelector('.val-date').value = dateVal;
            }
          }
        }

        updateAllSelectOptions();
        scheduleAutoSave();

        alert(`定義済みファイルから ${totalItems}件 の調書データ（全 ${totalPages}ページ）を作成しました！`);
      } catch (err) {
        alert('定義済みファイルの読み込みに失敗しました: ' + err.message);
      } finally {
        inputEl.value = '';
      }
    }

    async function loadCategoriesFromCsv(inputEl) {
      if (!inputEl.files || !inputEl.files[0]) return;
      const file = inputEl.files[0];

      try {
        const buffer = await file.arrayBuffer();
        let text = new TextDecoder('utf-8').decode(buffer);
        if (text.includes('\uFFFD')) {
          text = new TextDecoder('shift-jis').decode(buffer);
        }

        const rows = parseStrictCSV(text);
        const newPoints = [];
        const newItems = [];
        const newRemarks = [];

        rows.forEach((cols, idx) => {
          if (idx === 0) {
            const headerStr = cols.join(' ');
            if (headerStr.includes('上段') || headerStr.includes('中段') || headerStr.includes('下段') ||
                headerStr.includes('調査地点') || headerStr.includes('大項目') || headerStr.includes('項目') || headerStr.includes('備考')) {
              return;
            }
          }

          if (cols.length > 0 && cols[0] && cols[0] !== '') {
            const val = cols[0].trim();
            if (val && !newPoints.includes(val)) newPoints.push(val);
          }
          if (cols.length > 1 && cols[1] && cols[1] !== '') {
            const val = cols[1].trim();
            if (val && !newItems.includes(val)) newItems.push(val);
          }
          if (cols.length > 2 && cols[2] && cols[2] !== '') {
            const val = cols[2].trim();
            if (val && !newRemarks.includes(val)) newRemarks.push(val);
          }
        });

        if (newPoints.length === 0 && newItems.length === 0 && newRemarks.length === 0) {
          alert('有効な選択肢データが見つかりませんでした。');
          return;
        }

        CATEGORIES_POINT = newPoints;
        CATEGORIES_ITEM = newItems;
        CATEGORIES_REMARK = newRemarks;

        updateAllSelectOptions();
        await saveMasterCategories();
        scheduleAutoSave();

        alert(`CSVから選択肢を読み込みました！\n・調査地点: ${newPoints.length}件\n・項目: ${newItems.length}件\n・備考: ${newRemarks.length}件`);
      } catch (err) {
        alert('CSVファイルの読み込みに失敗しました: ' + err.message);
      } finally {
        inputEl.value = '';
      }
    }

    function convertDMSToDD(dms, ref) {
      if (!dms || dms.length < 3) return null;
      let dd = dms[0].numerator / dms[0].denominator +
               (dms[1].numerator / dms[1].denominator) / 60 +
               (dms[2].numerator / dms[2].denominator) / 3600;
      if (ref === "S" || ref === "W") dd = dd * -1;
      return dd.toFixed(6);
    }

    function setGpsToCard(card, gpsStr) {
      if (!card) return;

      }
      scheduleAutoSave();
    }

    /* 💡 【iOSサスペンド復帰完全対応】6秒十分待機タイマープロミス */
    function getGpsSafePromise(timeoutMs = 6000) {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          return reject(new Error("NOT_SUPPORTED"));
        }

        let timer = setTimeout(() => {
          reject(new Error("JS_HARD_TIMEOUT"));
        }, timeoutMs);

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            clearTimeout(timer);
            resolve(pos);
          },
          (err) => {
            clearTimeout(timer);
            reject(err);
          },
          { enableHighAccuracy: false, timeout: timeoutMs, maximumAge: 300000 }
        );
      });
    }

    /* 💡 位置情報取得メイン処理 */
    async function getGpsDirect(btnEl) {
      const card = btnEl.closest('.photo-card');
      if (!card) return;
      const gpsInput = card.querySelector('.val-gps');
      if (!gpsInput) return;

      if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        gpsInput.value = "⚠️ HTTPS(SSL)通信必須";
        return;
      }

      gpsInput.value = "📍 位置測位中...";

      try {
        const pos = await getGpsSafePromise(6000);
        const lat = pos.coords.latitude.toFixed(6);
        const lon = pos.coords.longitude.toFixed(6);
        preCapturedGps = `${lat}, ${lon}`;
        gpsInput.value = preCapturedGps;
        scheduleAutoSave();
      } catch (err) {
        console.warn("GPS Diagnostic Catch:", err.message || err.code);
        if (err.code === 1) {
          gpsInput.value = "⚠️ Err1: 権限拒否(サイトブロック)";
          alert("【位置情報がドメイン単位でブロックされています】\n1. Chrome画面右下の「…」➔「設定」\n2. 「コンテンツの設定」➔「位置情報」を許可に変更してください。");
        } else if (err.code === 2) {
          gpsInput.value = "⚠️ Err2: 屋内/電波障害";
        } else if (err.message === "JS_HARD_TIMEOUT" || err.code === 3) {
          gpsInput.value = "⚠️ Err3: 応答停止(再試行可)";
        } else {
          gpsInput.value = "⚠️ Err4: 取得不能";
        }
      }
    }

    /* 💡 画像処理（高画質長辺1600px / 85%品質）＆ EXIF自動連動解析 */
    function previewImage(input, targetId) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const card = input.closest('.photo-card');
        const imageBox = input.closest('.image-box');

        // カメラ復帰後のiOSスリープ解除（1.0秒）を待ってから測位を開始
        setTimeout(() => {
          const btn = card ? card.querySelector('.gps-btn') : null;
          if (btn) getGpsDirect(btn);
        }, 1000);

        const now = new Date();
        const nowFormattedDate = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

        // 📷 高画質プレビュー画像描画（長辺1600px / 85%品質）
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgObj = new Image();
          imgObj.onload = function() {
            const canvas = document.createElement('canvas');
            const maxDim = 1600;
            let width = imgObj.width;
            let height = imgObj.height;

            if (width > height) {
              if (width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              }
            } else {
              if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(imgObj, 0, 0, width, height);

            canvas.toBlob((blob) => {
              const targetImg = document.getElementById(targetId);
              if (targetImg._blobUrl) URL.revokeObjectURL(targetImg._blobUrl);
              targetImg._blob = blob;
              targetImg._blobUrl = URL.createObjectURL(blob);
              targetImg.src = targetImg._blobUrl;
              targetImg.style.display = 'block';

              if (imageBox) {
                const btnGroup = imageBox.querySelector('.placeholder-btn-group');
                if (btnGroup) btnGroup.style.display = 'none';
                const removeBtn = imageBox.querySelector('.img-remove-btn');
                if (removeBtn) removeBtn.style.display = 'block';
              }

              // EXIF解析（写真データ内にGPSがある場合の上書き優先処理）
              if (typeof EXIF !== 'undefined') {
                try {
                  EXIF.getData(file, function() {
                    const exifDate = EXIF.getTag(this, "DateTimeOriginal");
                    if (exifDate) {
                      const parts = exifDate.split(" ");
                      if (parts.length >= 2) {
                        const dateParts = parts[0].split(":");
                        if (dateParts.length === 3 && card) {
                          const dateInput = card.querySelector('.val-date');
                          if (dateInput) dateInput.value = `${dateParts[0]}-${dateParts[1]}-${dateParts[2]}`;
                        }
                      }
                    } else {
                      if (card) {
                        const dateInput = card.querySelector('.val-date');
                        if (dateInput) dateInput.value = nowFormattedDate;
                      }
                    }

                    const lat = EXIF.getTag(this, "GPSLatitude");
                    const latRef = EXIF.getTag(this, "GPSLatitudeRef") || "N";
                    const lon = EXIF.getTag(this, "GPSLongitude");
                    const lonRef = EXIF.getTag(this, "GPSLongitudeRef") || "E";

                    if (lat && lon) {
                      const latDD = convertDMSToDD(lat, latRef);
                      const lonDD = convertDMSToDD(lon, lonRef);
                      if (latDD && lonDD) {
                        setGpsToCard(card, `${latDD}, ${lonDD}`);
                      }
                    }
                  });
                } catch(err) {
                  console.warn("EXIF read error:", err);
                }
              }

              scheduleAutoSave();
            }, 'image/jpeg', 0.85);
          };
          imgObj.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function clearImage(targetId, btnEl) {

    const DB_NAME = 'SitePhotoReportDB_3Cards_v37';
    const STORE_PROJECTS = 'projects';
    const STORE_MASTERS = 'masters';

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_PROJECTS)) {
            db.createObjectStore(STORE_PROJECTS, { keyPath: 'name' });
          }
          if (!db.objectStoreNames.contains(STORE_MASTERS)) {
            db.createObjectStore(STORE_MASTERS);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function collectAppData() {
      const data = [];
      document.querySelectorAll('.a4-page').forEach(page => {
        const pageData = { photos: [] };
        page.querySelectorAll('.photo-card').forEach(card => {
          const img = card.querySelector('img');
          pageData.photos.push({
            point: card.querySelector('.val-point').value,
            item: card.querySelector('.val-item').value,
            remark: card.querySelector('.val-remark').value,
            gps: card.querySelector('.val-gps').value,

            blob: (img.style.display !== 'none' && img._blob) ? img._blob : null
          });
        });
        data.push(pageData);
      });
      return data;
    }

    function blobToDataURL(blob) {
      return new Promise((resolve) => {
        if (!blob) return resolve('');
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    }

    function dataURLtoBlob(dataurl) {
      if (!dataurl) return null;
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while(n--) { u8arr[n] = bstr.charCodeAt(n); }
      return new Blob([u8arr], {type:mime});
    }

    async function exportProjectFile() {
      const projName = prompt("「ファイル」アプリに書き出すプロジェクト名を入力してください:", "現場写真調書データ");
      if (!projName || !projName.trim()) return;

      const pages = document.querySelectorAll('.a4-page');
      if (pages.length === 0) return alert('データがありません。');

      const exportPages = [];
      for (const page of pages) {
        const pageData = { photos: [] };
        const cards = page.querySelectorAll('.photo-card');
        for (const card of cards) {
          const img = card.querySelector('img');
          let dataUrl = '';
          if (img.style.display !== 'none' && img._blob) {
            dataUrl = await blobToDataURL(img._blob);
          }
          pageData.photos.push({
            point: card.querySelector('.val-point').value,
            item: card.querySelector('.val-item').value,
            remark: card.querySelector('.val-remark').value,
            gps: card.querySelector('.val-gps').value,
            date: card.querySelector('.val-date').value,
            dataUrl: dataUrl
          });
        }
        exportPages.push(pageData);
      }

      const exportObj = {
        version: "1.0",
        projectName: projName,
        createdAt: new Date().toISOString(),
        categoriesPoint: CATEGORIES_POINT,
        categoriesItem: CATEGORIES_ITEM,
        categoriesRemark: CATEGORIES_REMARK,
        pages: exportPages
      };

      const jsonStr = JSON.stringify(exportObj);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement("a");
      a.href = url;
      a.download = `${projName.trim()}_${getTodayString()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

        pageData.photos.forEach((pData, idx) => {

            card.querySelector('.val-gps').value = pData.gps || '';

            if (pData.dataUrl || pData.blob) {
              const blob = pData.blob ? pData.blob : dataURLtoBlob(pData.dataUrl);
              if (blob) {
                img._blob = blob;
                if (img._blobUrl) URL.revokeObjectURL(img._blobUrl);

        };
      } catch (e) {
        alert('削除エラー: ' + e.message);
      }
    }

    window.onload = async function() {
      try {
        await loadMasterCategories();
        const restored = await loadAutoDraft();
        if (!restored) {
          addPage();
        }
      } catch (err) {
        console.warn("Init fallback:", err);
        addPage();
      }

      const container = document.getElementById('pages-container');
      if (container) {
        container.addEventListener('input', scheduleAutoSave);
        container.addEventListener('change', scheduleAutoSave);
      }
    };
  </script>
</body>
</html>
